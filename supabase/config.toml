# Shimmr backend.
#
# Every function authenticates the Shimmr CLI's own install token rather than a
# Supabase JWT, so the gateway's JWT check is turned off and each function does
# its own check instead. See supabase/README.md.

project_id = "shimmr"

# The website's sign-in, not the CLI's. Supabase Auth issues a magic link
# for a browser session; the CLI still carries its own install token and
# never touches this. See ADR 0011.
#
# This section documents local-dev intent (`supabase start`). The *deployed*
# project's Site URL and additional redirect URLs are a setting in the
# Supabase dashboard (Authentication -> URL Configuration) this file cannot
# reach — add the Vercel deployment's URL(s) there by hand once it exists,
# the same manual-step shape as the GitHub Pages source setting was.
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[functions.signup]
verify_jwt = false

[functions.login]
verify_jwt = false

[functions.usage]
verify_jwt = false

[functions.events]
verify_jwt = false

# The browser-pairing flow behind `shimmr login`/`shimmr signup` opening a
# browser instead of trusting --email. cli_claim still authenticates a real
# Supabase Auth session — manually, inside the function, exactly like every
# other function here does its own check — so verify_jwt is off for it too,
# for the same reason. See supabase/functions/cli_claim and ADR 0012.
[functions.cli_start]
verify_jwt = false

[functions.cli_poll]
verify_jwt = false

[functions.cli_claim]
verify_jwt = false
