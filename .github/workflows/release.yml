name: Release

# Cutting a release is pushing a tag. Everything else happens here, so the
# artifacts a customer downloads are built by a recorded, repeatable job rather
# than on somebody's laptop.
#
# Nobody needs a local git client with push access to do that: pick "Run
# workflow" above, type a version, leave dry_run unchecked. The tag job below
# creates and pushes the real tag itself before anything is built, so the
# result is indistinguishable from someone having run `git tag && git push`
# — it's just done from a browser instead. Cutting a release stays a
# deliberate, one-at-a-time action; nothing here fires on its own. See ADR
# 0010.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 — no leading v. Required unless dry_run is checked."
        type: string
        default: ""
      dry_run:
        description: "Build and check the artifacts, but create no tag and publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Only for a real (non-dry-run) manual release: create and push the version
  # tag so the rest of this run has one to build from, and so the repository
  # ends up with the exact same tag history a local `git tag && git push`
  # would have left. A plain tag push skips this — the tag already exists.
  tag:
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: create and push the tag
        id: tag
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            echo "::error::version is required for a real release (or check dry_run to just build)."
            exit 1
          fi
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version must be semver without a leading v, e.g. 0.2.0 — got '$version'."
            exit 1
          fi
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: [tag]
    # Runs for a plain tag push (tag job skipped, not applicable), a dry run
    # (tag job skipped, nothing to build from but VERSION falls back to
    # 0.0.0-dev), or after the tag job above actually created a tag. Only
    # skips if that job ran and failed.
    if: always() && needs.tag.result != 'failure'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The engine manifest must name a published upstream artifact and its
      # checksum. Empty entries are deliberate in the repository, and must stop
      # a release rather than produce a bundle nobody verified.
      - name: engine is pinned
        run: |
          url=$(python3 scripts/engine_manifest.py url "${{ matrix.goos }}" "${{ matrix.goarch }}")
          sha=$(python3 scripts/engine_manifest.py sha256 "${{ matrix.goos }}" "${{ matrix.goarch }}")
          if [ -z "$url" ] || [ -z "$sha" ]; then
            echo "::error::packaging/engine.json has no url/sha256 for ${{ matrix.goos }}/${{ matrix.goarch }}."
            echo "::error::Fill it in from the pinned engine release before tagging."
            exit 1
          fi

      - name: package
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || (needs.tag.outputs.version && format('v{0}', needs.tag.outputs.version)) || '0.0.0-dev' }}
          ENDPOINT: ${{ vars.SHIMMR_ENDPOINT }}
          SITE_URL: ${{ vars.SHIMMR_SITE_URL }}
        run: |
          # Tags are v-prefixed; the version stamped into artifacts is not.
          export VERSION="${VERSION#v}"
          bash scripts/package.sh "${{ matrix.goos }}" "${{ matrix.goarch }}"

      # An artifact that cannot run is worse than no artifact. For the native
      # platform we can actually check, so we do.
      - name: the built binary runs
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          mkdir -p /tmp/check
          tar -xzf dist/shimmr-linux-amd64.tar.gz -C /tmp/check
          dir=$(find /tmp/check -maxdepth 1 -type d -name 'shimmr-*' | head -1)
          "$dir/shimmr" version
          # The licence notice is a legal obligation, not a nicety: fail the
          # release if the shipped binary cannot produce it.
          "$dir/shimmr" licenses | grep -q "Copyright (c)" \
            || { echo "::error::shipped binary prints no copyright notice"; exit 1; }
          test -f "$dir/LICENSES/engine-MIT.txt" \
            || { echo "::error::engine licence missing from the archive"; exit 1; }
          test -f "$dir/LICENSES/engine-third-party.md" \
            || { echo "::error::engine third-party notices missing from the archive"; exit 1; }

          # The engine in the archive must expose the surface we document. We
          # once published a count read from upstream main rather than from the
          # release, and were wrong by two tools; this makes the number a fact
          # about the artifact instead of a claim about some other code.
          want=$(python3 scripts/engine_manifest.py tool_count linux amd64)
          got=$(python3 scripts/engine_tools.py "$dir/shimmr-engine" --count)
          echo "engine exposes $got tools (manifest says $want)"
          if [ "$got" != "$want" ]; then
            echo "::error::the engine exposes $got tools, but packaging/engine.json says $want."
            echo "::error::Re-check the surface and update the manifest and docs/01-engine-findings.md."
            python3 scripts/engine_tools.py "$dir/shimmr-engine"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: shimmr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          retention-days: 7

  publish:
    needs: [package, tag]
    runs-on: ubuntu-latest
    if: always() && needs.package.result == 'success' && !inputs.dry_run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: collect checksums
        run: |
          cd staging
          ls -lh
          cat *.sha256 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      # The GitHub release is the record; object storage is what people can
      # actually reach, because this repository is private. Publishing happens
      # before the release is cut so a failure here does not leave a published
      # release pointing at files nobody can download.
      - name: publish where people can download it
        env:
          ARTIFACT_HOST: ${{ vars.ARTIFACT_HOST || 'supabase' }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # See the tag_name comment below: github.ref_name is the dispatched
        # branch, not the tag, on a manual run.
        run: bash scripts/publish_artifacts.sh staging "${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.tag.outputs.version) }}"

      - uses: softprops/action-gh-release@v2
        with:
          # A tag-push run's own ref is already the tag. A workflow_dispatch
          # run's ref stays the branch it was dispatched on even after the
          # tag job above pushed a real tag as a side effect, so this action
          # needs to be told explicitly which one it's releasing.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.tag.outputs.version) }}
          files: |
            staging/*.tar.gz
            staging/*.zip
            staging/*.sha256
            staging/SHA256SUMS
          generate_release_notes: true
          body: |
            Install:

            ```sh
            curl -fsSL https://fpxntzwkiepnwsazmaxf.supabase.co/storage/v1/object/public/releases/install.sh | sh
            ```

            The assets attached here are the same files, but this repository is
            private, so they 404 for anyone but us. The link above is the one to
            share.

            Then `shimmr signup`, `shimmr init`, `shimmr doctor`.

            Every archive contains the Shimmr binary, the indexing engine, and
            the licence notices for both. Checksums are published alongside;
            the installer verifies them and refuses to install without.
