name: Deploy site

# The public "coming soon" page under site/ — a Next.js app, statically
# exported. This repository is private, so GitHub Pages is what makes it
# reachable by anyone who isn't a collaborator — the same problem ADR 0009
# solved for release downloads, for the marketing page instead of the
# binary.
#
# One-time setup this workflow cannot do for itself: Settings -> Pages ->
# Build and deployment -> Source: "GitHub Actions". Until that's set, this
# runs and uploads the artifact but there's nowhere for deploy-pages to
# publish it.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: build
        env:
          # This repo's Pages site serves under /shimmr/, not repo-root.
          GITHUB_PAGES_BASE_PATH: /shimmr
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

      - id: deployment
        uses: actions/deploy-pages@v4
