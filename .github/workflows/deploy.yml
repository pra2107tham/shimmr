name: Deploy backend

# Applies migrations and deploys the Edge Functions when backend code lands on
# main. Manual runs are allowed so a deploy can be retried without an empty
# commit.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: check secrets are set
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=""
          [ -n "$ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$PROJECT_REF" ]  || missing="$missing SUPABASE_PROJECT_REF"
          [ -n "$DB_PASSWORD" ]  || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "Add them under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      - name: link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # Prints what would change before changing it, so the run log is a record
      # of every migration ever applied.
      - name: pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      - name: deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy signup    --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy login     --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy usage     --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy events    --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy cli_start --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy cli_poll  --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy cli_claim --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: smoke the deployed endpoints
        run: |
          BASE="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1"

          # A GET must be refused with 405 — proves the function is live and
          # that the JWT gateway is not intercepting our own auth.
          for fn in signup login usage events cli_start cli_poll cli_claim; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/$fn")
            echo "GET /$fn -> $code"
            [ "$code" = "405" ] || { echo "expected 405 from $fn" >&2; exit 1; }
          done

          # The authenticated endpoints must refuse an anonymous caller. events
          # is the one that now runs continuously, and cli_claim is the one
          # that actually creates an account, so an open one would be a
          # standing invitation to write into anybody's usage — or connect a
          # machine to an account that never confirmed it.
          for fn in usage events cli_claim; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'content-type: application/json' -d '{}' "$BASE/$fn")
            echo "POST /$fn with no token -> $code"
            [ "$code" = "401" ] || { echo "expected 401 from $fn, got $code" >&2; exit 1; }
          done

          # A bad token must be refused too, not just a missing one — for both
          # auth shapes this backend has: an install token (events) and a
          # Supabase Auth session (cli_claim).
          for fn in events cli_claim; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'content-type: application/json' -H 'authorization: Bearer shm_not_a_real_token' \
              -d '{"events":[],"code":"AAAA-AAAA"}' "$BASE/$fn")
            echo "POST /$fn with a bogus token -> $code"
            [ "$code" = "401" ] || { echo "expected 401 for a bogus token from $fn, got $code" >&2; exit 1; }
          done

          # cli_start and cli_poll take no token by design — the code itself
          # is the credential — but they must still refuse garbage input
          # rather than accept it silently.
          for fn in cli_start cli_poll; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'content-type: application/json' -d '{}' "$BASE/$fn")
            echo "POST /$fn with an empty body -> $code"
            [ "$code" = "400" ] || { echo "expected 400 from $fn, got $code" >&2; exit 1; }
          done
