name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The product promise is one file with no runtime to install, so a build
      # that needs cgo is a broken build even when it compiles here.
      - name: build every platform
        run: make dist

      - name: confirm the binary is static
        run: |
          file dist/shimmr-*-linux-amd64
          file dist/shimmr-*-linux-amd64 | grep -q "statically linked"

      - uses: actions/upload-artifact@v4
        with:
          name: shimmr-binaries
          path: dist/
          retention-days: 14

  edge-functions:
    name: edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: fmt
        run: deno fmt --check supabase/functions

      - name: lint
        run: deno lint supabase/functions

      # Type-checks against the real supabase-js types, so a wrong column name
      # or a bad client call fails here rather than in production.
      - name: type check
        run: deno check supabase/functions/signup/index.ts supabase/functions/usage/index.ts

  database:
    name: schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # Applies the real migration to a real Postgres, then asserts the schema
      # behaves: uniqueness, cascades, the check constraint, both views' maths,
      # and that RLS is on with no policies.
      - name: apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "-- $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: schema tests
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/schema_test.sql

      # The seed has to keep working too, or `supabase db reset` breaks for
      # everyone the first time someone runs it.
      - name: seed loads
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "select count(*) as orgs from org_totals;"

      - name: inspection queries run
        run: |
          for q in supabase/queries/*.sql; do
            echo "-- $q"
            psql "$PGURL" -v ON_ERROR_STOP=1 -q -f "$q" > /dev/null
          done

  installers:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Packaging is what turns a build into the file customers download, and
      # it has four ways to go wrong quietly: the engine arrives as an archive,
      # the member has to be lifted out of it, the checksum covers the archive
      # rather than the binary, and the engine's own notices have to come along.
      # This drives all of it against a synthetic release, so it needs no
      # network and no 300 MB download.
      - name: packaging
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/package_test.sh

      # A stand-in engine that answers doctor's handshake, so the job can check
      # the whole path: download, checksum, extract, install, find the engine
      # in the packaged layout, and start it. The real engine is 285 MB and
      # adds nothing to any of that.
      - name: build a release archive with a stand-in engine
        shell: bash
        run: |
          set -eu
          goos=linux; [ "${{ matrix.os }}" = "windows-latest" ] && goos=windows
          exe=""; [ "$goos" = "windows" ] && exe=".exe"
          go build -o "stub-engine$exe" ./internal/engine/testdata/fakeengine
          ENGINE_SRC="$PWD/stub-engine$exe" bash scripts/package.sh "$goos" amd64
          mkdir -p serve/latest/download
          cp dist/shimmr-$goos-amd64.* serve/latest/download/
          ls -l serve/latest/download

      # Windows ships python.exe, not python3. Backgrounding in a subshell always
      # succeeds, so the old `python3 ... || python ...` fallback could never
      # have fired — the job would have waited out the timeout and then failed
      # with a confusing download error instead.
      - name: serve it
        shell: bash
        run: |
          for c in python3 python; do
            if command -v $c >/dev/null 2>&1 && $c -c "import sys" >/dev/null 2>&1; then
              py=$c; break
            fi
          done
          [ -n "${py:-}" ] || { echo "::error::no python available to serve the archive"; exit 1; }
          cd serve && $py -m http.server 8080 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          echo "::error::the local server never came up"
          exit 1

      - name: install (unix)
        if: matrix.os == 'ubuntu-latest'
        run: |
          SHIMMR_BASE_URL=http://127.0.0.1:8080 SHIMMR_PREFIX="$HOME/.local" sh install.sh
          "$HOME/.local/bin/shimmr" version
          "$HOME/.local/bin/shimmr" licenses | grep -q "Copyright (c)"

      - name: install (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:SHIMMR_BASE_URL = 'http://127.0.0.1:8080'
          $env:SHIMMR_PREFIX   = "$env:RUNNER_TEMP\ShimmrTest"
          ./install.ps1
          & "$env:RUNNER_TEMP\ShimmrTest\shimmr.exe" version
          $lic = & "$env:RUNNER_TEMP\ShimmrTest\shimmr.exe" licenses | Out-String
          if ($lic -notmatch [regex]::Escape('Copyright (c)')) {
            Write-Error "the installed binary prints no copyright notice"
            exit 1
          }
          exit 0

      # The unix layout puts the engine under lib/, not beside the binary, so
      # what is checked here is the ../lib/shimmr candidate — and that the
      # engine the installer placed actually starts.
      - name: the installed binary finds and starts its engine (unix)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export SHIMMR_HOME="$RUNNER_TEMP/home"
          shimmr="$HOME/.local/bin/shimmr"
          "$shimmr" signup --email ci@example.com --org "CI Org" > /dev/null
          out=$("$shimmr" doctor 2>&1) || { echo "$out"; echo "::error::doctor exited non-zero"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "lib/shimmr/shimmr-engine" \
            || { echo "::error::doctor did not find the engine in the prefix layout"; exit 1; }
          echo "$out" | grep -q "engine  ready" \
            || { echo "::error::the installed engine did not start"; exit 1; }

      # The point of the Windows fix: the engine ships as shimmr-engine.exe, and
      # a bare "shimmr-engine" stat never finds it. doctor is what proves the
      # installed binary can locate its own engine and run it.
      - name: the installed binary finds and starts its engine (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:SHIMMR_HOME = "$env:RUNNER_TEMP\home"
          $shimmr = "$env:RUNNER_TEMP\ShimmrTest\shimmr.exe"
          & $shimmr signup --email ci@example.com --org "CI Org" | Out-Null
          $out  = & $shimmr doctor 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($out -notmatch [regex]::Escape('shimmr-engine.exe')) {
            Write-Error "doctor could not find shimmr-engine.exe beside the binary"
            exit 1
          }
          # Matched loosely: the real line carries an em dash, and what matters
          # here is that the engine started, not how the verdict is punctuated.
          if ($out -notmatch 'engine\s+ready') {
            Write-Error "the installed engine did not start"
            exit 1
          }
          if ($code -ne 0) {
            Write-Error "doctor exited $code"
            exit 1
          }
          exit 0

      - name: refuses a tampered archive
        shell: bash
        run: |
          set -eu
          goos=linux; [ "${{ matrix.os }}" = "windows-latest" ] && goos=windows
          ext=tar.gz; [ "$goos" = "windows" ] && ext=zip
          printf 'tampered' >> "serve/latest/download/shimmr-$goos-amd64.$ext"
          echo "(checksum left untouched, archive modified)"

      - name: tampered install must fail (unix)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if SHIMMR_BASE_URL=http://127.0.0.1:8080 SHIMMR_PREFIX="$RUNNER_TEMP/bad" sh install.sh; then
            echo "::error::installer accepted a tampered archive"; exit 1
          fi
          test ! -d "$RUNNER_TEMP/bad" || { echo "::error::files were installed anyway"; exit 1; }

      - name: tampered install must fail (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:SHIMMR_BASE_URL = 'http://127.0.0.1:8080'
          $env:SHIMMR_PREFIX   = "$env:RUNNER_TEMP\Bad"
          ./install.ps1
          if ($LASTEXITCODE -eq 0) {
            Write-Error "installer accepted a tampered archive"
            exit 1
          }
          if (Test-Path "$env:RUNNER_TEMP\Bad\shimmr.exe") {
            Write-Error "files were installed anyway"
            exit 1
          }
          Write-Host "correctly refused"
          # The runner ends a pwsh step on $LASTEXITCODE, which still carries
          # the 1 the installer exited with on purpose. Refusing was the pass
          # condition, so say so rather than inheriting it.
          exit 0

  smoke:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make build

      # Drives the real binary over stdio against a stand-in engine, checking
      # the things unit tests cannot: that the account gate holds, that stdout
      # carries only JSON-RPC, and that no path or query reaches the log.
      - name: smoke test
        run: ./scripts/smoke.sh
